name: Update list every 10 min

on:
  #schedule:
    #- cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download and build lists
        run: |
          #cat.txt
          curl -s https://raw.githubusercontent.com/ShadowException/VPN/refs/heads/main/configs/VPN-cat-top-50 \
          | tail -n +9 > cat.txt

          #mera.txt = mera all
          curl -s https://raw.githubusercontent.com/meraws/MeraVPN/refs/heads/inside/sub \
          | tail -n +11 > mera.txt

          #mera_lte.txt
          curl -s https://raw.githubusercontent.com/meraws/MeraVPN/refs/heads/inside/lte \
          | tail -n +7 > mera_lte.txt
          
          #mera_default.txt
          curl -s https://raw.githubusercontent.com/meraws/MeraVPN/refs/heads/inside/default \
          | tail -n +11 > mera_default.txt

          #mera_flask.txt
          curl -s https://raw.githubusercontent.com/meraws/MeraVPN/refs/heads/inside/flask \
          | tail -n +11 > mera_flask.txt

          
          # Очищаем catzieng.txt
          > catzieng.txt
          # CAT
          curl -s https://raw.githubusercontent.com/ShadowException/VPN/refs/heads/main/configs/VPN-cat-top-50 \
          | tail -n +9 >> catzieng.txt
          # IGARECK
          curl -s https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt \
          | tail -n +6 >> catzieng.txt
          curl -s https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt \
          | tail -n +6 >> catzieng.txt
          # Удаляем дубликаты
          sort -u catzieng.txt -o catzieng.txt

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cat.txt mera.txt mera_lte.txt mera_default.txt mera_flask.txt catzieng.txt
          git diff --cached --quiet || git commit -m "Auto update list"
          git push
