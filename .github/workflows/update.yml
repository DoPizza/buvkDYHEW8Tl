name: Update

on:
  #schedule:
    #- cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download and build lists
        run: |
          #cat.txt
          curl -s https://raw.githubusercontent.com/ShadowException/VPN/refs/heads/main/configs/VPN-cat-top-50 \
          | tail -n +9 > cat.txt


          #test.txt = 
          curl -s https://raw.githubusercontent.com/opti4riponty-arch/VLESS-Co/refs/heads/main/VLESS%20%26%20Co \
          | tail -n +12 > test.txt


          

          #mera_lte.txt
          curl -s https://raw.githubusercontent.com/meraws/MeraVPN/refs/heads/inside/lte \
          | tail -n +11 > mera_lte.txt
          
          

          #mera_flask.txt
          curl -s https://raw.githubusercontent.com/meraws/MeraVPN/refs/heads/inside/flask \
          | tail -n +11 > mera_flask.txt

          
          # Очищаем catigareck.txt
          > catigareck.txt
          # CAT
          curl -s https://raw.githubusercontent.com/ShadowException/VPN/refs/heads/main/configs/VPN-cat-top-50 \
          | tail -n +9 >> catigareck.txt
          # IGARECK
          curl -s https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt \
          | tail -n +6 >> catigareck.txt
          curl -s https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt \
          | tail -n +6 >> catigareck.txt
          # Удаляем дубликаты
          sort -u catigareck.txt -o catigareck.txt

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cat.txt mera_lte.txt mera_flask.txt catigareck.txt test.txt
          git diff --cached --quiet || git commit -m "Auto update list"
          git push
